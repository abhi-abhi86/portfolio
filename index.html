<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhishek M G - Portfolio</title>
    <link rel="stylesheet" href="dist/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="font-['Inter'] text-gray-900">
    <!-- Hero Section -->
    <div w3-include-html="sections/hero.html"></div>

    <!-- About Section -->
    <div w3-include-html="sections/about.html"></div>

    <!-- Projects Section -->
    <div w3-include-html="sections/projects.html"></div>

    <!-- Footer -->
    <footer class="bg-primary text-white py-8">
        <div class="max-w-4xl mx-auto text-center">
            <p>&copy; 2025 Abhishek M G. All rights reserved.</p>
        </div>
    </footer>

    <script src="src/js/main.js"></script>
    <script>
        // Simple HTML include function
        function includeHTML() {
            var z, i, elmnt, file, xhttp;
            z = document.getElementsByTagName("*");
            for (i = 0; i < z.length; i++) {
                elmnt = z[i];
                file = elmnt.getAttribute("w3-include-html");
                if (file) {
                    xhttp = new XMLHttpRequest();
                    xhttp.onreadystatechange = function() {
                        if (this.readyState == 4) {
                            if (this.status == 200) {
                                elmnt.innerHTML = this.responseText;
                            }
                            if (this.status == 404) {
                                elmnt.innerHTML = "Page not found.";
                            }
                            elmnt.removeAttribute("w3-include-html");
                            includeHTML();
                        }
                    }
                    xhttp.open("GET", file, true);
                    xhttp.send();
                    return;
                }
            }
        }
        includeHTML();
    </script>
</body>

</html>
